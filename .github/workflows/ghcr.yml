name: Publish GHCR

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/jmanzanog/infinitellm

jobs:
    publish:
        # Run only if CI succeeded and it was a push to main
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (same commit that CI validated)
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.6"

            - uses: docker/setup-buildx-action@v3

            - name: Test (Full Suite)
              run: go test -v ./... -race

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build for scan
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: ${{ env.IMAGE }}:scan
                  cache-from: type=gha

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@0.34.0
              with:
                  image-ref: ${{ env.IMAGE }}:scan
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

            - name: Build & push (multi-arch linux)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ env.IMAGE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    cleanup:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Delete older images
              uses: snok/container-retention-policy@v3.0.1
              with:
                  account: user
                  token: ${{ secrets.GITHUB_TOKEN }}
                  image-names: "infinitellm"
                  cut-off: 7d
                  keep-n-most-recent: 5
